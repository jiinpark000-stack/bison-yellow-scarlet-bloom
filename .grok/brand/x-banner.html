<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>모이뱅크 banner</title>
<style>
  @font-face {
    font-family: "Black Han Sans";
    src: url("../fonts/BlackHanSans.ttf") format("truetype");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Gowun Dodum";
    src: url("../fonts/GowunDodum.ttf") format("truetype");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Song Myung";
    src: url("../fonts/SongMyung.ttf") format("truetype");
    font-weight: 400;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 264px; overflow: hidden; }
  body { background: #E7E0D3; }

  .desk {
    position: relative;
    width: 1200px;
    height: 264px;
    background:
      radial-gradient(900px 260px at 30% 40%, #F3EEE4 0%, #E7E0D3 70%, #D9D0C0 100%);
  }
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.16;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
  }

  .book {
    position: absolute;
    left: 28px;
    top: 22px;
    width: 1144px;
    height: 220px;
    filter: drop-shadow(0 10px 16px rgba(26, 25, 22, 0.24));
  }
  .book-thickness {
    position: absolute;
    left: 10px;
    top: 8px;
    width: 1134px;
    height: 212px;
    background: #143F35;
    border-radius: 14px 16px 16px 14px;
  }
  .cover {
    position: absolute;
    left: 0;
    top: 0;
    width: 1134px;
    height: 212px;
    background:
      linear-gradient(90deg, #12352E 0 36px, transparent 36px),
      linear-gradient(180deg, #22705B 0%, #1B5C4A 50%, #174F40 100%);
    border-radius: 12px 16px 16px 12px;
    overflow: hidden;
  }
  .cover::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 7px);
    mix-blend-mode: overlay;
  }
  .gold-frame {
    position: absolute;
    left: 48px;
    top: 14px;
    right: 16px;
    bottom: 14px;
    border: 2px solid #D4C4A0;
    border-radius: 6px;
    box-shadow: inset 0 0 0 5px rgba(27, 92, 74, 0.35), inset 0 0 0 7px #C4B089;
  }

  /* Lockup: left half, above midline. Safe: left 50% × top 80%. */
  .plate {
    position: absolute;
    left: 72px;
    top: 28px;
    width: 430px;
    height: 132px;
    background: linear-gradient(#F7F3EA, #F3EEE4);
    border: 1px solid #D8D0C2;
    border-radius: 5px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 6px 12px rgba(20, 63, 53, 0.16);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 14px 28px 16px;
  }
  .kicker {
    font-family: "Song Myung", serif;
    font-size: 13px;
    letter-spacing: 0.38em;
    color: #1B5C4A;
    padding-left: 0.1em;
    margin-bottom: 2px;
  }
  .title {
    font-family: "Black Han Sans", sans-serif;
    font-size: 64px;
    line-height: 0.92;
    color: #1A1916;
    letter-spacing: 0.04em;
  }
  .tagline {
    font-family: "Gowun Dodum", sans-serif;
    font-size: 18px;
    color: #1D4E89;
    letter-spacing: 0.16em;
    margin-top: 4px;
    padding-left: 0.08em;
  }

  .stamp {
    position: absolute;
    left: 470px;
    top: 34px;
    width: 90px;
    height: 90px;
    transform: rotate(-10deg);
    border-radius: 50%;
    border: 6px solid #B42318;
    box-shadow: inset 0 0 0 2px #B42318;
    display: grid;
    place-items: center;
    background: rgba(243, 238, 228, 0.92);
    font-family: "Black Han Sans", sans-serif;
    font-size: 26px;
    color: #B42318;
    letter-spacing: 0.04em;
  }

  .ticker {
    position: absolute;
    left: 590px;
    right: 36px;
    top: 58px;
    height: 40px;
    background: #F3EEE4;
    border: 1px solid #D4C4A0;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 0 18px;
    gap: 18px;
    font-family: "Gowun Dodum", sans-serif;
    font-size: 18px;
    color: #1A1916;
    white-space: nowrap;
    overflow: hidden;
  }
  .up { color: #B42318; }
  .down { color: #1D4E89; }
  .dot { color: #1B5C4A; opacity: 0.55; }

  .coin {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #E8D59A, #C4A35A 55%, #8F7333);
    box-shadow: 0 2px 0 #6F5824;
    display: grid;
    place-items: center;
    font-family: "Song Myung", serif;
    color: #6F5824;
  }
  .c1 { right: 70px; top: 118px; width: 34px; height: 34px; font-size: 15px; }
  .c2 { right: 98px; top: 128px; width: 26px; height: 26px; font-size: 12px; }
</style>
</head>
<body>
  <div class="desk">
    <div class="book">
      <div class="book-thickness"></div>
      <div class="cover">
        <div class="gold-frame"></div>
        <div class="plate">
          <div class="kicker">우리 반 통장</div>
          <div class="title">모이뱅크</div>
          <div class="tagline">교실 미니 증권</div>
        </div>
        <div class="stamp">모이</div>
        <div class="ticker">
          <span>삼성전자 <span class="up">▲ 2.1</span></span>
          <span class="dot">·</span>
          <span>카카오 <span class="down">▼ 1.4</span></span>
          <span class="dot">·</span>
          <span>현대차 <span class="up">▲ 0.8</span></span>
          <span class="dot">·</span>
          <span>NAVER <span class="up">▲ 1.1</span></span>
        </div>
        <div class="coin c1">₩</div>
        <div class="coin c2">₩</div>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
