<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>모이뱅크</title>
<style>
  @font-face {
    font-family: "Black Han Sans";
    src: url("../fonts/BlackHanSans.ttf") format("truetype");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Gowun Dodum";
    src: url("../fonts/GowunDodum.ttf") format("truetype");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Song Myung";
    src: url("../fonts/SongMyung.ttf") format("truetype");
    font-weight: 400;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #E7E0D3;
    font-family: "Gowun Dodum", sans-serif;
    color: #1A1916;
  }

  .desk {
    position: relative;
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(1200px 500px at 50% 40%, #F3EEE4 0%, #E7E0D3 62%, #D9D0C0 100%);
  }

  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.18;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
  }

  .book {
    position: absolute;
    left: 78px;
    top: 48px;
    width: 1044px;
    height: 534px;
    filter: drop-shadow(0 18px 28px rgba(26, 25, 22, 0.28));
  }

  .book-thickness {
    position: absolute;
    left: 18px;
    top: 14px;
    width: 1026px;
    height: 520px;
    background: #143F35;
    border-radius: 18px 22px 22px 18px;
  }

  .cover {
    position: absolute;
    left: 0;
    top: 0;
    width: 1026px;
    height: 520px;
    background:
      linear-gradient(90deg, #12352E 0 46px, transparent 46px),
      linear-gradient(180deg, #22705B 0%, #1B5C4A 38%, #174F40 100%);
    border-radius: 16px 20px 20px 16px;
    overflow: hidden;
  }

  .cover::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.035) 0 2px,
        transparent 2px 7px
      );
    mix-blend-mode: overlay;
  }

  .spine-stitch {
    position: absolute;
    left: 18px;
    top: 28px;
    bottom: 28px;
    width: 10px;
    border-left: 2px dashed rgba(243, 238, 228, 0.28);
    border-right: 2px dashed rgba(243, 238, 228, 0.18);
  }

  .gold-frame {
    position: absolute;
    left: 64px;
    top: 28px;
    right: 28px;
    bottom: 28px;
    border: 2px solid #D4C4A0;
    border-radius: 8px;
    box-shadow: inset 0 0 0 6px rgba(27, 92, 74, 0.35), inset 0 0 0 8px #C4B089;
  }

  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border: 2px solid #D4C4A0;
  }
  .corner.tl { top: 40px; left: 76px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 40px; right: 40px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 40px; left: 76px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 40px; right: 40px; border-left: 0; border-top: 0; }

  .plate {
    position: absolute;
    left: 190px;
    top: 86px;
    width: 640px;
    height: 278px;
    background:
      linear-gradient(#F7F3EA, #F3EEE4);
    border: 1px solid #D8D0C2;
    border-radius: 6px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.7) inset,
      0 10px 18px rgba(20, 63, 53, 0.18);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 36px 32px;
  }

  .plate-rules {
    position: absolute;
    inset: 18px 22px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0 31px,
      rgba(29, 78, 137, 0.08) 31px 32px
    );
    pointer-events: none;
    border-radius: 4px;
  }

  .kicker {
    position: relative;
    font-family: "Song Myung", serif;
    font-size: 18px;
    letter-spacing: 0.42em;
    color: #1B5C4A;
    margin-bottom: 10px;
    padding-left: 0.42em;
  }

  .title {
    position: relative;
    font-family: "Black Han Sans", sans-serif;
    font-size: 132px;
    line-height: 0.92;
    color: #1A1916;
    letter-spacing: 0.04em;
    text-align: center;
    font-weight: 400;
  }

  .rule {
    position: relative;
    width: 220px;
    height: 3px;
    background: #1B5C4A;
    margin: 14px 0 12px;
    border-radius: 2px;
  }

  .tagline {
    position: relative;
    font-family: "Gowun Dodum", sans-serif;
    font-size: 28px;
    color: #1D4E89;
    letter-spacing: 0.18em;
    padding-left: 0.18em;
  }

  .stamp {
    position: absolute;
    right: 148px;
    top: 286px;
    width: 122px;
    height: 122px;
    transform: rotate(-11deg);
    border-radius: 50%;
    border: 7px solid #B42318;
    box-shadow: inset 0 0 0 3px #B42318, 0 4px 6px rgba(26,25,22,0.18);
    display: grid;
    place-items: center;
    background: rgba(243, 238, 228, 0.92);
    font-family: "Black Han Sans", sans-serif;
    font-size: 36px;
    color: #B42318;
    letter-spacing: 0.06em;
  }

  .ticker {
    position: absolute;
    left: 96px;
    right: 48px;
    bottom: 52px;
    height: 46px;
    background: #F3EEE4;
    border: 1px solid #D4C4A0;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    font-family: "Gowun Dodum", sans-serif;
    font-size: 20px;
    letter-spacing: 0.04em;
    color: #1A1916;
    box-shadow: 0 2px 0 rgba(20, 63, 53, 0.12);
  }
  .up { color: #B42318; }
  .down { color: #1D4E89; }
  .dot { color: #1B5C4A; opacity: 0.55; }

  .coin {
    position: absolute;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #E8D59A, #C4A35A 55%, #8F7333);
    box-shadow: 0 3px 0 #6F5824, 0 6px 10px rgba(26,25,22,0.2);
    display: grid;
    place-items: center;
    font-family: "Song Myung", serif;
    color: #6F5824;
    font-size: 20px;
  }
  .c1 { left: 36px; bottom: 28px; }
  .c2 { left: 68px; bottom: 18px; width: 36px; height: 36px; font-size: 16px; }
  .c3 { left: 22px; bottom: 58px; width: 32px; height: 32px; font-size: 14px; }

  .pen {
    position: absolute;
    right: 22px;
    top: 86px;
    width: 18px;
    height: 420px;
    transform: rotate(8deg);
    background: linear-gradient(90deg, #163A68, #1D4E89 40%, #2A63A4 70%, #163A68);
    border-radius: 9px 9px 4px 4px;
    box-shadow: 0 8px 16px rgba(26,25,22,0.2);
  }
  .pen::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -16px;
    transform: translateX(-50%);
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 18px solid #1A1916;
  }
  .pen-band {
    position: absolute;
    top: 70px;
    left: -1px;
    right: -1px;
    height: 18px;
    background: #D4C4A0;
  }
</style>
</head>
<body>
  <div class="desk">
    <div class="book">
      <div class="book-thickness"></div>
      <div class="cover">
        <div class="spine-stitch"></div>
        <div class="gold-frame"></div>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="plate">
          <div class="plate-rules"></div>
          <div class="kicker">우리 반 통장</div>
          <div class="title">모이뱅크</div>
          <div class="rule"></div>
          <div class="tagline">교실 미니 증권</div>
        </div>
        <div class="stamp">모이</div>
        <div class="ticker">
          <span>삼성전자 <span class="up">▲ 2.1</span></span>
          <span class="dot">·</span>
          <span>카카오 <span class="down">▼ 1.4</span></span>
          <span class="dot">·</span>
          <span>현대차 <span class="up">▲ 0.8</span></span>
          <span class="dot">·</span>
          <span>NAVER <span class="up">▲ 1.1</span></span>
        </div>
      </div>
    </div>
    <div class="coin c1">₩</div>
    <div class="coin c2">₩</div>
    <div class="coin c3">₩</div>
    <div class="pen"><div class="pen-band"></div></div>
    <div class="grain"></div>
  </div>
</body>
</html>
